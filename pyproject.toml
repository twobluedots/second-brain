[project]
name = "second-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "chromadb>=1.2.1",
    "easyocr>=1.7.2",
    "langgraph>=1.0.3",
    "ollama>=0.4.0",
    "openai>=2.6.0",
    "openai-whisper>=20250625",
    "pillow>=12.0.0",
    "pytesseract>=0.3.13",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.51.0",
    "ragas>=0.4.3",
    "langchain-ollama>=1.1.0",
    "rapidfuzz>=3.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
